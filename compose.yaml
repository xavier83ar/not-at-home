services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: notathome
      POSTGRES_USER: notathome
      POSTGRES_PASSWORD: notathome
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI

volumes:
  postgres-data:
