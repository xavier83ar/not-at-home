spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}

app:
  frontend-url: ${FRONTEND_URL}
  mail:
    from: ${MAIL_FROM}
  uploads:
    # No default here: a temp directory would lose every upload on restart.
    dir: ${APP_UPLOADS_DIR}

server:
  servlet:
    session:
      cookie:
        secure: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
