spring:
  profiles:
    # Plain `./mvnw spring-boot:run` is the dev setup; production sets SPRING_PROFILES_ACTIVE=prod.
    default: dev
  application:
    name: not-at-home
  mail:
    properties:
      # A slow or dead mail server must not hang requests.
      "mail.smtp.connectiontimeout": 5000
      "mail.smtp.timeout": 5000
      "mail.smtp.writetimeout": 5000
  web:
    # English only (NFR-7): validation messages must not follow the server or browser language.
    locale: en
    locale-resolver: fixed
  jpa:
    open-in-view: false
  session:
    jdbc:
      # Tables are created by Flyway (see db/migration).
      initialize-schema: never
  servlet:
    multipart:
      # Above the 5 MB the upload endpoint itself enforces, so that limit (with its field error)
      # is what a slightly-over-sized upload hits, not this one.
      max-file-size: 8MB
      max-request-size: 8MB

app:
  rate-limit:
    # Only switch off for local testing (APP_RATE_LIMIT_ENABLED=false).
    enabled: true
  # Public address of the site (no trailing slash); links in emails point here.
  frontend-url: http://localhost:3000
  mail:
    from: noreply@notathome.local
  uploads:
    # Local disk directory for uploaded files; relative to where the backend runs in dev (gitignored).
    # Production must point this at a persisted volume (APP_UPLOADS_DIR).
    dir: ${APP_UPLOADS_DIR:uploads}
  seed:
    # Only read with the `seed` profile active (see README, "Seed data"); blank the rest of the
    # time, which is fine, since nothing reads these unless that profile is on.
    admin-username: ${SEED_ADMIN_USERNAME:}
    admin-email: ${SEED_ADMIN_EMAIL:}
    admin-password: ${SEED_ADMIN_PASSWORD:}
    user-username: ${SEED_USER_USERNAME:}
    user-email: ${SEED_USER_EMAIL:}
    user-password: ${SEED_USER_PASSWORD:}

server:
  # Behind the frontend's proxy the backend sees the frontend's address, not the visitor's.
  # "native" lets Tomcat read the proxy's X-Forwarded-For/-Proto/-Host, but only from proxies it
  # trusts (loopback and private network addresses by default; override with the environment
  # variable SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES). The rate limits depend on this: see README.
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health
      path-mapping:
        health: health
  health:
    # An unreachable SMTP server must not make the app report itself as down.
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger-ui.html
